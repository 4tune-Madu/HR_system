        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: employee_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employee Documents
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
