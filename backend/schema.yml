openapi: 3.0.3
info:
  title: HR Management System API
  version: 1.0.0
  description: API documentation for the HR Management System
paths:
  /api/auth/account/setup/{uidb64}/{token}/:
    post:
      operationId: set_password
      description: Set the password for an invited account using a valid one-time
        setup token.
      summary: Set account password
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: One-time password setup token.
        required: true
      - in: path
        name: uidb64
        schema:
          type: string
        description: URL-safe encoded user ID.
        required: true
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPassword'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Password successfully set.
        '400':
          description: Invalid or expired setup link.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Successfully logged out.
        '400':
          description: Invalid or missing refresh token.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/employees/organizations/{organization_id}/employees/:
    get:
      operationId: employee_list
      description: Return all employees belonging to the specified organization.
      summary: List employees
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employees
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
          description: ''
    post:
      operationId: employee_create
      description: Create a new employee and their related employee records.
      summary: Create employee
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/employees/organizations/{organization_id}/employees/{employee_id}/:
    get:
      operationId: employee_detail
      description: Retrieve a single employee within an organization.
      summary: Get employee
      parameters:
      - in: path
        name: employee_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employees
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    post:
      operationId: employee_deactivate
      description: Deactivate an employee. The employee is not deleted and can no
        longer be treated as active.
      summary: Deactivate employee
      parameters:
      - in: path
        name: employee_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Employee'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Employee'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    patch:
      operationId: employee_update
      description: Update an employee and their related employee information.
      summary: Update employee
      parameters:
      - in: path
        name: employee_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeCreate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/employees/organizations/{organization_id}/employees/{employee_id}/account/invite/:
    post:
      operationId: employee_account_invite
      description: Send or resend the password setup invitation for an existing employee
        account.
      summary: Send employee account invitation
      parameters:
      - in: path
        name: employee_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employee Accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Invitation sent successfully.
        '400':
          description: Employee account is not eligible for an invitation.
        '404':
          description: Employee not found.
  /api/employees/organizations/{organization_id}/employees/{employee_id}/account/provision/:
    post:
      operationId: employee_account_provision
      description: Create a user account for an existing employee, link the account
        to the employee, create the organization membership, assign the requested
        role, and require initial password setup.
      summary: Provision employee account
      parameters:
      - in: path
        name: employee_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Employee Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeAccountProvision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeAccountProvision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeAccountProvision'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
        '400':
          description: Account could not be provisioned.
        '404':
          description: Employee not found.
  /api/employees/organizations/{organization_id}/employees/{employee_id}/activate/:
    post:
      operationId: employee_activate
      description: Reactivate an inactive employee and restore their organization
        membership and account access.
      summary: Activate employee
      parameters:
      - in: path
        name: employee_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_id
