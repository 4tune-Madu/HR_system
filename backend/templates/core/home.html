<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HR+</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #0b0b0e;
  --ink-soft: #4a4a55;
  --surface: #ffffff;
  --muted: #96969f;
  --border: #eaeaef;

  --violet: #7c6ef2;
  --lilac: #cabcfb;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-pill: 999px;

  --font-ui: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 2rem;
  --fs-2xl: 3.1rem;

  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  font-family: var(--font-ui);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;

  /* faded, low-saturation gradient backdrop */
  background:
    radial-gradient(760px 520px at 88% -10%, rgba(124, 110, 242, 0.14), transparent 62%),
    radial-gradient(640px 480px at 4% 105%, rgba(124, 110, 242, 0.10), transparent 62%),
    linear-gradient(180deg, #fdfdff 0%, #fbfaff 50%, #f8f7fc 100%);
}

button { font-family: inherit; }
a { color: inherit; text-decoration: none; }

button:focus-visible, a:focus-visible {
  outline: 2px solid var(--violet);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- Top bar — utility icons, login included ---------- */
.topbar {
  display: flex;
  justify-content: flex-end;
  padding: var(--space-6) var(--space-7);
  position: relative;
  z-index: 2;
}

.util-group {
  display: flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: 4px;
  backdrop-filter: blur(6px);
}

.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.icon-btn:hover { background: var(--surface); color: var(--ink); }
.icon-btn svg { opacity: 0.7; }
.icon-btn:hover svg { opacity: 0.95; }

.util-divider {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 2px;
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 96px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-6);
}

.hero-inner {
  text-align: center;
  max-width: 480px;
  animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin: 0 0 var(--space-4);
}

h1 {
  font-size: var(--fs-2xl);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 0 0 var(--space-6);
  color: var(--ink);
}
h1 em {
  font-style: normal;
  color: var(--violet);
}

.divider {
  width: 32px;
  height: 1px;
  background: var(--border);
  margin: var(--space-6) auto var(--space-4);
}

.helper-text {
  font-size: var(--fs-xs);
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.01em;
}

@media (max-width: 560px) {
  .topbar { padding: var(--space-5) var(--space-4); }
  h1 { font-size: var(--fs-xl); }
}
</style>
</head>
<body>

  <header class="topbar">
    <div class="util-group">
      <button class="icon-btn" aria-label="Log in" id="loginBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M10 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 16l4-4-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 12H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="util-divider"></div>
      <button class="icon-btn" aria-label="Help">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9.6 9.3a2.4 2.4 0 1 1 3.6 2.08c-.75.43-1.2.86-1.2 1.72" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="16.3" r="0.9" fill="currentColor"/>
        </svg>
      </button>
      <div class="util-divider"></div>
      <button class="icon-btn" aria-label="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.2 13.6a1.35 1.35 0 0 0 .27 1.49l.05.05a1.65 1.65 0 1 1-2.33 2.33l-.05-.05a1.35 1.35 0 0 0-1.49-.27 1.35 1.35 0 0 0-.82 1.24V18.6a1.65 1.65 0 0 1-3.3 0v-.07a1.35 1.35 0 0 0-.88-1.24 1.35 1.35 0 0 0-1.49.27l-.05.05a1.65 1.65 0 1 1-2.33-2.33l.05-.05a1.35 1.35 0 0 0 .27-1.49 1.35 1.35 0 0 0-1.24-.82H5.4a1.65 1.65 0 0 1 0-3.3h.07a1.35 1.35 0 0 0 1.24-.88 1.35 1.35 0 0 0-.27-1.49l-.05-.05A1.65 1.65 0 1 1 8.72 5.99l.05.05a1.35 1.35 0 0 0 1.49.27h.06a1.35 1.35 0 0 0 .82-1.24V4.9a1.65 1.65 0 0 1 3.3 0v.07a1.35 1.35 0 0 0 .82 1.24h.06a1.35 1.35 0 0 0 1.49-.27l.05-.05a1.65 1.65 0 1 1 2.33 2.33l-.05.05a1.35 1.35 0 0 0-.27 1.49v.06a1.35 1.35 0 0 0 1.24.82h.13a1.65 1.65 0 0 1 0 3.3h-.07a1.35 1.35 0 0 0-1.24.82Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="hero">
    <div class="hero-inner">
      <p class="eyebrow">BT Human Resource Management</p>
      <h1>Welcome to <em>HR+</em></h1>

      <div class="divider"></div>
      <p class="helper-text">Need access? Contact your workspace administrator.</p>
    </div>
  </main>

<script>
  // Placeholder — wire this to the real login page/route when it exists.
  document.getElementById('loginBtn').addEventListener('click', () => {
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
